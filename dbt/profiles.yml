olist_profile:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: "{{ env_var('DB_DRIVER') }}"
      server: "{{ env_var('DB_SERVER') }}"
      port: 1433
      database: "{{ env_var('DB_NAME') }}"
      schema: staging
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      authentication: sql
      threads: 1
      timeout_seconds: 300
      encrypt: true      
      trust_cert: true   